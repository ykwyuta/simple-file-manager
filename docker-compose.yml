services:
  # 1. PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: file-manager-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-filemanager_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. S3-Compatible Storage (Garage)
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: file-manager-garage
    ports:
      - "3900:3900" # S3 API
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      - RUST_LOG=garage=info
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN:?set GARAGE_METRICS_TOKEN in .env}
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 3. Spring Boot Application
  app:
    build: .
    container_name: file-manager-app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - garage
    # All secrets come from .env (see .env.example). Nothing credential-shaped
    # belongs in this file -- it is committed.
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-filemanager_db}
      DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Garage S3 connection settings
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  postgres_data:
  garage_meta:
  garage_data:
