# H2 Database Profile Configuration (Development/Testing)

# --- Database Configuration ---
spring.datasource.url=jdbc:h2:mem:filemanagerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console. Reachable at /h2-console but restricted to the admins role by
# SecurityConfig -- it executes arbitrary SQL, so it is not for ordinary users.
# Keep it off unless you are actively debugging.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --- JPA/Hibernate Configuration ---
# The same migrations run here as in production, so a change that only works
# under Hibernate's schema generation cannot pass development unnoticed.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Bootstrap accounts (development) ---
app.bootstrap.demo-user=true
