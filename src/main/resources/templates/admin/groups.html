<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('グループ管理 | File Manager')}"></head>

<body>
    <svg th:replace="~{fragments/layout :: icons}"></svg>
    <div class="container">
        <header>
            <h1><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg> グループ管理</h1>
            <div class="actions">
                <a href="/" class="btn btn-secondary">
                    <svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg> ファイル一覧に戻る
                </a>
            </div>
        </header>

        <div th:if="${message}" class="alert alert-success">
            <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg> <span th:text="${error}"></span>
        </div>

        <div class="actions" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
            <button onclick="openModal('createGroupModal')" class="btn btn-primary">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg> グループを作成
            </button>
            <a href="/admin/users" class="btn btn-secondary">
                <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg> ユーザー管理
            </a>
        </div>

        <div class="card">
            <table class="file-list">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th>Group Name</th>
                        <th scope="col">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="group : ${groups}">
                        <td th:text="${group.id}">1</td>
                        <td th:text="${group.name}">groupname</td>
                        <td>
                            <div class="actions">
                                <button type="button" th:data-id="${group.id}" th:data-name="${group.name}"
                                    onclick="openEditGroupModal(this.getAttribute('data-id'), this.getAttribute('data-name'))"
                                    class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                    <svg class="icon" aria-hidden="true"><use href="#i-edit"></use></svg> 編集
                                </button>
                                <form th:action="@{'/admin/groups/' + ${group.id} + '/delete'}" method="post"
                                    onsubmit="return confirm('このグループを削除しますか？所有グループは admins に移管されます。');"
                                    style="display: inline;">
                                    <button type="submit" class="btn btn-danger"
                                        style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                        <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg> 削除
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(groups)}">
                        <td colspan="3" style="text-align: center; color: var(--text-secondary);">
                            No groups found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div id="createGroupModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">グループを作成</h2>
            <form th:action="@{/admin/groups}" method="post">
                <div class="form-group">
                    <label for="newGroupName">グループ名</label>
                    <input type="text" id="newGroupName" name="name" maxlength="64" pattern="[A-Za-z0-9._-]+" class="form-control" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="closeModal('createGroupModal')"
                        class="btn btn-secondary">キャンセル</button>
                    <button type="submit" class="btn btn-primary">作成</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Group Modal -->
    <div id="editGroupModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">グループを編集</h2>
            <form id="editGroupForm" method="post">
                <input th:replace="~{fragments/layout :: csrf}">
                <div class="form-group">
                    <label for="newGroupName">グループ名</label>
                    <input type="text" id="editGroupName" name="name" class="form-control" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="closeModal('editGroupModal')"
                        class="btn btn-secondary">キャンセル</button>
                    <button type="submit" class="btn btn-primary">更新</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openEditGroupModal(id, name) {
            document.getElementById('editGroupForm').action = '/admin/groups/' + id + '/update';
            document.getElementById('editGroupName').value = name;
            openModal('editGroupModal');
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
    </script>
</body>

</html>
