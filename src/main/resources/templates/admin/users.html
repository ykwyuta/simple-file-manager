<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('ユーザー管理 | File Manager')}"></head>

<body>
    <svg th:replace="~{fragments/layout :: icons}"></svg>
    <div class="container">
        <header>
            <h1><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg> ユーザー管理</h1>
            <div class="actions">
                <a href="/" class="btn btn-secondary">
                    <svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg> ファイル一覧に戻る
                </a>
            </div>
        </header>

        <div th:if="${message}" class="alert alert-success">
            <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg> <span th:text="${error}"></span>
        </div>

        <div class="actions" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
            <button onclick="openModal('createUserModal')" class="btn btn-primary">
                <svg class="icon" aria-hidden="true"><use href="#i-user-plus"></use></svg> ユーザーを作成
            </button>
            <a href="/admin/groups" class="btn btn-secondary">
                <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg> グループ管理
            </a>
        </div>

        <div class="card">
            <table class="file-list">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">ユーザー名</th>
                        <th scope="col">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">username</td>
                        <td>
                            <div class="actions">
                                <button type="button" th:data-id="${user.id}" th:data-username="${user.username}"
                                    th:data-group-ids="${#strings.listJoin(user.groups.![id], ',')}"
                                    onclick="openEditUserModal(this.getAttribute('data-id'), this.getAttribute('data-username'), this.getAttribute('data-group-ids'))"
                                    class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                    <svg class="icon" aria-hidden="true"><use href="#i-edit"></use></svg> 編集
                                </button>
                                <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post"
                                    onsubmit="return confirm('このユーザーを削除しますか？所有ファイルは admin に移管されます。');"
                                    style="display: inline;">
                                    <button type="submit" class="btn btn-danger"
                                        style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                        <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg> 削除
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="3" style="text-align: center; color: var(--text-secondary);">
                            No users found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create User Modal -->
    <div id="createUserModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">ユーザーを作成</h2>
            <form th:action="@{/admin/users}" method="post">
                <div class="form-group">
                    <label for="newUsername">ユーザー名</label>
                    <input type="text" id="newUsername" name="username" maxlength="64" pattern="[A-Za-z0-9._@-]+" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">パスワード</label>
                    <input type="password" id="newPassword" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>所属グループ</label>
                    <div
                        style="max-height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; border-radius: 4px;">
                        <div th:each="group : ${groups}" style="margin-bottom: 0.25rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                                <input type="checkbox" name="groupIds" th:value="${group.id}">
                                <span th:text="${group.name}">Group Name</span>
                            </label>
                        </div>
                        <div th:if="${#lists.isEmpty(groups)}" style="color: var(--text-secondary); font-size: 0.9rem;">
                            No groups available.
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="closeModal('createUserModal')"
                        class="btn btn-secondary">キャンセル</button>
                    <button type="submit" class="btn btn-primary">作成</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">ユーザーを編集</h2>
            <form id="editUserForm" method="post">
                <input th:replace="~{fragments/layout :: csrf}">
                <div class="form-group">
                    <label for="newUsername">ユーザー名</label>
                    <input type="text" id="editUsername" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password (Leave blank to keep unchanged)</label>
                    <input type="password" name="password" class="form-control">
                </div>
                <div class="form-group">
                    <label>所属グループ</label>
                    <div
                        style="max-height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; border-radius: 4px;">
                        <div th:each="group : ${groups}" style="margin-bottom: 0.25rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                                <input type="checkbox" name="groupIds" th:value="${group.id}">
                                <span th:text="${group.name}">Group Name</span>
                            </label>
                        </div>
                        <div th:if="${#lists.isEmpty(groups)}" style="color: var(--text-secondary); font-size: 0.9rem;">
                            No groups available.
                        </div>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="closeModal('editUserModal')"
                        class="btn btn-secondary">キャンセル</button>
                    <button type="submit" class="btn btn-primary">更新</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openEditUserModal(id, username, groupIdsStr) {
            document.getElementById('editUserForm').action = '/admin/users/' + id + '/update';
            document.getElementById('editUsername').value = username;

            // Reset checkboxes
            document.querySelectorAll('#editUserModal input[name="groupIds"]').forEach(cb => cb.checked = false);

            // Check appropriate boxes
            if (groupIdsStr) {
                const ids = groupIdsStr.split(',').map(s => s.trim());
                ids.forEach(groupId => {
                    const checkbox = document.querySelector(`#editUserModal input[name="groupIds"][value="${groupId}"]`);
                    if (checkbox) checkbox.checked = true;
                });
            }

            openModal('editUserModal');
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
    </script>
</body>

</html>
