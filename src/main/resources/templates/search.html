<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('検索結果 | File Manager')}"></head>

<body>
    <svg th:replace="~{fragments/layout :: icons}"></svg>
    <div class="container">
        <header>
            <h1><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg> 検索結果</h1>
            <a href="/" class="btn btn-secondary"><svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg> ファイル一覧に戻る</a>
        </header>

        <div class="search-bar" style="margin-bottom: 2rem;">
            <form th:action="@{/search}" method="get" style="display: flex; gap: 0.5rem; width: 100%;">
                <label for="searchQuery" class="visually-hidden">ファイル名</label>
                <input type="text" id="searchQuery" name="query" class="form-control" th:value="${query}"
                    placeholder="ファイル名で検索...">
                <label for="searchTags" class="visually-hidden">タグ</label>
                <input type="text" id="searchTags" name="tags" class="form-control" th:value="${tags}"
                    placeholder="タグ (カンマ区切り)">
                <button type="submit" class="btn btn-primary">検索</button>
            </form>
        </div>

        <div class="card">
            <table class="file-list">
                <thead>
                    <tr>
                        <th scope="col">名前</th>
                        <th scope="col">場所</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file : ${files}">
                        <td>
                            <a th:if="${file.directory}" th:href="@{'/?folderId=' + ${file.id}}" class="folder-link">
                                <svg class="icon file-icon folder-icon" aria-hidden="true"><use href="#i-folder"></use></svg>
                                <span th:text="${file.name}">Folder</span>
                            </a>
                            <span th:unless="${file.directory}" class="folder-link" style="cursor: default;">
                                <svg class="icon file-icon" aria-hidden="true"><use href="#i-file"></use></svg>
                                <span th:text="${file.name}">File</span>
                            </span>
                        </td>
                        <td>
                            <span th:if="${file.parent != null}" th:text="${file.parent.name}">Parent</span>
                            <span th:if="${file.parent == null}">/</span>
                        </td>
                        <td th:text="${#temporals.format(file.updatedAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                        <td>
                            <div class="actions">
                                <a th:unless="${file.directory}" th:href="@{'/api/files/' + ${file.id}}"
                                    class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                    <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
                                </a>
                                <a th:if="${file.directory}" th:href="@{'/?folderId=' + ${file.id}}"
                                    class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                    <svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(files)}">
                        <td colspan="4" class="empty-state"
                            th:text="${hasCriteria} ? '条件に一致するファイルはありませんでした。' : '検索条件を入力してください。'">
                            検索条件を入力してください。
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
