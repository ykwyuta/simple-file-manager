<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head th:replace="~{fragments/layout :: head('ゴミ箱 | File Manager')}"></head>

<body>
    <svg th:replace="~{fragments/layout :: icons}"></svg>
    <div class="container">
        <header>
            <h1><svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg> ゴミ箱</h1>
            <a href="/" class="btn btn-secondary"><svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg> ファイル一覧に戻る</a>
        </header>

        <div th:if="${message}" class="alert alert-success">
            <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <svg class="icon" aria-hidden="true"><use href="#i-alert"></use></svg> <span th:text="${error}"></span>
        </div>

        <div class="card">
            <table class="file-list">
                <thead>
                    <tr>
                        <th scope="col">名前</th>
                        <th scope="col">削除日時</th>
                        <th scope="col">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="file : ${files}">
                        <td>
                            <svg th:if="${file.directory}" class="icon file-icon folder-icon" aria-hidden="true"><use href="#i-folder"></use></svg>
                            <svg th:unless="${file.directory}" class="icon file-icon" aria-hidden="true"><use href="#i-file"></use></svg>
                            <span th:text="${file.name}">File</span>
                        </td>
                        <td th:text="${#temporals.format(file.deletedAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                        <td>
                            <form th:action="@{'/restore/' + ${file.id}}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-primary"
                                    style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">
                                    <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg> Restore
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(files)}">
                        <td colspan="3" class="empty-state">ゴミ箱は空です。</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                // Add close button
                const closeBtn = document.createElement('span');
                closeBtn.textContent = '\u00d7';
                closeBtn.className = 'close-btn';
                closeBtn.style.cursor = 'pointer';
                closeBtn.style.float = 'right';
                closeBtn.style.fontSize = '1.2rem';
                closeBtn.style.fontWeight = 'bold';
                closeBtn.style.marginLeft = '10px';
                closeBtn.onclick = function () {
                    alert.style.opacity = '0';
                    setTimeout(() => alert.remove(), 300);
                };
                alert.insertBefore(closeBtn, alert.firstChild);

                // Auto-dismiss after 5 seconds
                setTimeout(() => {
                    if (alert) {
                        alert.style.transition = 'opacity 0.5s ease';
                        alert.style.opacity = '0';
                        setTimeout(() => alert.remove(), 500);
                    }
                }, 5000);
            });
        });
    </script>
</body>

</html>
