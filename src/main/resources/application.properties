# Configuration is supplied via environment variables (see .env.example).
# For local development without Docker: --spring.profiles.active=h2

spring.application.name=file-manager

# The h2 development profile also uses filesystem storage, so the application
# runs with nothing but a JVM -- no database and no object store to install.
spring.profiles.group.h2=local-storage

# --- Schema migrations (Flyway) ---
# The schema is owned by db/migration, not by Hibernate. See docs/migrations.md.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# A database that predates Flyway (created by the old ddl-auto=update) is
# baselined at V1 -- the schema V1 describes -- so V1 is not replayed against
# existing tables and migration starts at V2. An empty database is not
# baselined at all and runs every migration from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created before Flyway was introduced

# --- JPA/Hibernate Configuration ---
# "validate": Hibernate checks the migrated schema matches the entities and
# refuses to start on a mismatch. It never alters the schema itself -- letting
# it do that hides drift and makes deployments unrepeatable.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Upload limits ---
# Without these Spring Boot's 1MB default applies, which is far too small for a
# file manager. Exceeding the limit is answered with 413, not 500.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:120MB}

# --- S3-compatible storage ---
# One source of truth: the S3_* environment variables feed the Spring Cloud AWS
# properties below, which build the S3Client, S3Template and S3Presigner. There
# used to be a hand-rolled S3Config bean alongside these, so the same endpoint
# and credentials were configured twice and could drift apart.
S3_BUCKET_NAME=${S3_BUCKET_NAME:files}
spring.cloud.aws.region.static=${S3_REGION:us-east-1}
spring.cloud.aws.endpoint=${S3_ENDPOINT_URL:http://localhost:3900}
spring.cloud.aws.s3.endpoint=${S3_ENDPOINT_URL:http://localhost:3900}
# Garage and MinIO address buckets by path, not by subdomain.
spring.cloud.aws.s3.path-style-access-enabled=true
spring.cloud.aws.credentials.access-key=${S3_ACCESS_KEY:dev-access-key}
spring.cloud.aws.credentials.secret-key=${S3_SECRET_KEY:dev-secret-key}

# --- Error handling ---
# Never expose stack traces or exception messages through the default error page.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Session cookie hardening ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Enable once the deployment terminates TLS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- Scheduled Deletion Job Properties ---
# Cron expression for the scheduled deletion job. Default is 2 AM every day.
file.deletion.cron=${DELETION_CRON:0 0 2 * * *}
# Retention period in days for soft-deleted files.
file.deletion.retention-period-days=${DELETION_RETENTION_DAYS:7}
